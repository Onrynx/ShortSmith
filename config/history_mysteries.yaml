# History Mysteries — LANE-agnostic channel config.
# Either channel can be night (local Wan2GP) or day (cloud) on any given day;
# the user assigns lanes interactively each morning in the PWA.
key: history_mysteries
name: History Mysteries
niche: "unsolved history mysteries"
angle: "one gripping unsolved story, honest about what's uncertain"
voice: am_adam              # Kokoro voice id — deep US male, the classic Shorts narrator sound
style: "cinematic, moody, historical, volumetric light, film grain"
banned: "gore, modern politics, living people"

# --- Output format: YouTube SHORTS (vertical 9:16, under 60s) ---------------
format: shorts              # shorts | long
orientation: vertical       # vertical (9:16) | horizontal (16:9)
target_seconds: 60          # aim ~42s
max_seconds: 60
exact_seconds: 60         # final video is EXACTLY 1 minute             # hard cap (auto speed-fit if narration overshoots)
scene_bounds: [6, 9]        # scenes per short
target_minutes: 6           # used only if format: long

# Hero-scene budget per lane (how many scenes get AI video vs stock/motion).
# Night (local Wan2GP) can afford more hero clips overnight; day (cloud free tier)
# is capped, so fewer heroes.
lane_budgets:
  night: [4, 8]
  day: [2, 4]
