# Gossip Stories — fictional out-of-context drama/storytime; pure hook fuel.
key: gossip_stories
name: Gossip Stories
niche: "modern real-life drama: family, relationships, betrayal, karma, revenge"
angle: "first-person confessions that sound like real Reddit posts — conflict in line one"
voice: am_adam            # Kokoro 'Adam' — the famous deep male Shorts narrator
voice_speed: 1.18         # fast, punchy pacing (0.6-1.6; VOICE_SPEED env overrides)
voice_11: pNInz6obpgDQGcFmaJgB   # ElevenLabs 'Adam' — the famous male narrator (needs free key)
voice_tiktok: en_us_006    # TikTok deep male (needs TIKTOK_TTS_URL)
style: "colorful dramatic slice-of-life, expressive, cinematic lighting"
banned: "fantasy, magic, kingdoms, sci-fi, worldbuilding, real people, real brands, gore"
story_mode: real_life_drama   # Reddit-confession doctrine, enforced
fiction: true               # ALL stories are invented for entertainment

format: shorts
orientation: vertical
min_seconds: 114           # 1.9 min — shortest allowed
target_seconds: 144        # 2.4 min — longest allowed (random pick in between)
max_seconds: 155           # hard ceiling before speed-fit kicks in
exact_seconds: 0
scene_bounds: [12, 18]

lane_budgets:
  night: [4, 8]
  day: [2, 4]
