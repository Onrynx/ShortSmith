name: Mac desktop

# Answers the one question left about the macOS download: what a person
# actually sees when they double-click Shortsmith for the first time.
#
# GitHub's macOS runners are real Apple Silicon Macs with a real screen. So
# this does the double-click, photographs whatever macOS puts on screen, opens
# System Settings to the place the override would live, and photographs that
# too. The pictures are attached to the run. Nobody has to connect to anything.
#
# spctl already told us Gatekeeper rejects the launcher outright
# (source=no usable signature). What it cannot tell us is whether that refusal
# comes with an "Open Anyway" button or is a dead end, because that is a
# property of the interface. Hence pictures.
#
# If you want to drive the Mac yourself afterwards, set `hold` to true and it
# hands over a session. That part needs the MAC_VNC_PASSWORD secret for the
# desktop; without it you still get a terminal.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test"
        required: false
        default: "v2.3.0"
      hold:
        description: "Also hand me the Mac afterwards (SSH, and desktop if the secret is set)"
        type: boolean
        required: false
        default: false
      minutes:
        description: "If holding, for how long (max 350)"
        required: false
        default: "45"

permissions:
  contents: read

jobs:
  desktop:
    name: What a person sees
    # macOS 26 (Tahoe), the current image and what macos-latest points at.
    # The first run used macos-14 (Sonoma), and Apple changed precisely this
    # behaviour in macOS 15 -- so even a clean answer there would not have been
    # the answer for anybody's actual Mac. macos-14 is also unsupported from
    # 2 November 2026.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Describe the machine
        run: |
          sw_vers
          echo "arch: $(uname -m)"

      # The real download, marked the way a browser marks it. curl does not set
      # the quarantine flag and Safari does, and that flag is the entire reason
      # macOS objects -- without it this would prove nothing.
      - name: Put the real download on the Desktop, marked as downloaded
        id: prep
        shell: bash
        run: |
          set +e
          DESK="$HOME/Desktop"; mkdir -p "$DESK"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ inputs.tag }}/Shortsmith-macOS.zip"
          curl -fL --progress-bar -o "$DESK/Shortsmith-macOS.zip" "$URL" || {
            echo "could not download ${{ inputs.tag }}"; exit 1; }

          STAMP="0081;$(printf '%x' "$(date +%s)");Safari;"
          xattr -w com.apple.quarantine "$STAMP" "$DESK/Shortsmith-macOS.zip"
          ditto -x -k "$DESK/Shortsmith-macOS.zip" "$DESK/unpacked" \
            || unzip -q "$DESK/Shortsmith-macOS.zip" -d "$DESK/unpacked"
          xattr -wr com.apple.quarantine "$STAMP" "$DESK/unpacked" 2>/dev/null

          APP="$DESK/unpacked/Shortsmith"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "ready: $APP"
          xattr -p com.apple.quarantine "$APP/Shortsmith.command" \
            && echo "launcher is marked as downloaded" \
            || echo "WARNING: launcher is NOT marked -- the test would be void"

      # Everything below reports what it found twice: once to the log in full,
      # and once as a ::notice::. GitHub makes you sign in to read a log, even
      # on a public repo. It does not make you sign in to read annotations.
      - name: Teach it to read the screen
        shell: bash
        run: |
          set +e
          cat > /tmp/readscreen.swift <<'SWIFT'
          // Hands a screenshot to the recogniser that is already part of
          // macOS and prints what it says. No network, no install, nothing
          // to trust -- Vision ships with the system.
          import Foundation
          import Vision
          import AppKit

          let path = CommandLine.arguments.count > 1 ? CommandLine.arguments[1] : ""
          guard let image = NSImage(contentsOfFile: path),
                let cg = image.cgImage(forProposedRect: nil, context: nil, hints: nil)
          else {
              print("could not open \(path)")
              exit(0)
          }
          let request = VNRecognizeTextRequest()
          request.recognitionLevel = .accurate
          request.usesLanguageCorrection = false
          try? VNImageRequestHandler(cgImage: cg, options: [:]).perform([request])
          let lines = (request.results ?? []).compactMap {
              $0.topCandidates(1).first?.string
          }
          print(lines.isEmpty ? "(nothing legible on screen)"
                              : lines.joined(separator: " | "))
          SWIFT

          if swiftc -O -o /tmp/readscreen /tmp/readscreen.swift 2>/tmp/swift.log; then
            echo "the screen reader is built"
          else
            echo "could not build the screen reader:"
            sed 's/^/    /' /tmp/swift.log
          fi

          cat > /tmp/helpers.sh <<'HELPERS'
          say_note () {
            printf '::notice title=%s::%s\n' "$1" \
              "$(printf '%s' "$2" | tr '\n\r' '  ' | sed 's/%/%25/g' | cut -c1-900)"
          }

          read_screen () {
            png="$1"; label="$2"
            if [ ! -s "$png" ]; then
              say_note "$label" "no screenshot was taken"
              echo "    no screenshot at $png"
              return
            fi
            text=$(/tmp/readscreen "$png" 2>/dev/null)
            [ -z "$text" ] && text="(the screen reader returned nothing)"
            printf '%s\n' "$text" | fold -s -w 110 | sed 's/^/    /'
            say_note "$label" "$text"
          }
          HELPERS

          # Prove it works now, on a screen whose contents nobody is waiting
          # on, rather than finding out two minutes later on the one screen
          # this whole run exists to read.
          . /tmp/helpers.sh
          mkdir -p /tmp/shots
          screencapture -x /tmp/shots/00-selftest.png
          echo "> reading the empty desktop, as a test:"
          read_screen /tmp/shots/00-selftest.png "Screen reader self-test"

      - name: Can the screen be photographed at all?
        id: canshoot
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/shots
          screencapture -x /tmp/shots/00-baseline.png 2>/tmp/shots/err.txt
          if [ -s /tmp/shots/00-baseline.png ]; then
            echo "yes: $(du -h /tmp/shots/00-baseline.png | cut -f1)"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "no -- screencapture produced nothing:"
            cat /tmp/shots/err.txt
            echo "(macOS may be refusing screen recording to this process)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # THE TEST. `open` is what Finder uses for a double-click, so this is the
      # same path a person takes.
      #
      # Every stream is sent to /dev/null and nothing is ever waited on. An
      # earlier version piped `open` into sed, so the launched app inherited
      # the step's output pipe and the job hung for 39 minutes -- a step does
      # not end while anything still holds its output.
      - name: Double-click it, and photograph what macOS says
        shell: bash
        run: |
          set +e
          APP="${{ steps.prep.outputs.app }}"

          echo "opening via LaunchServices, exactly as a double-click does"
          open "$APP/Shortsmith.command" </dev/null >/dev/null 2>&1 &
          sleep 12

          screencapture -x /tmp/shots/01-after-double-click.png
          echo "> and what it says, word for word:"
          . /tmp/helpers.sh
          read_screen /tmp/shots/01-after-double-click.png "What the refusal says"

          # Whatever may have started, stop it. Nothing may hold this step open.
          pkill -f "shortsmith.app"   >/dev/null 2>&1
          pkill -f "Shortsmith.command" >/dev/null 2>&1
          osascript -e 'tell application "Terminal" to quit' >/dev/null 2>&1
          sleep 2

      - name: Open Privacy & Security, and read what is on it
        shell: bash
        run: |
          set +e
          . /tmp/helpers.sh

          # Dismiss the refusal dialog by clicking its own Done button.
          #
          # killall CoreServicesUIAgent was tried and does not work: the agent
          # restarts and brings the message back, so the dialog stayed on top
          # and the keys went to it instead of to System Settings.
          #
          # Click "Done" by name, never by position and never with Return --
          # the DEFAULT button on this dialog is "Move to Trash", so a stray
          # Return deletes the thing under test.
          echo "> dismissing the dialog by clicking Done"
          DONE=$(osascript <<'APPLESCRIPT' 2>&1
          tell application "System Events"
            if not (exists process "CoreServicesUIAgent") then
              return "no dialog process running"
            end if
            tell process "CoreServicesUIAgent"
              try
                set names to {}
                repeat with b in buttons of window 1
                  set end of names to name of b
                end repeat
                click button "Done" of window 1
                return "clicked Done. the buttons offered were: " & (names as string)
              on error errMsg
                return "could not click Done: " & errMsg
              end try
            end tell
          end tell
          APPLESCRIPT
          )
          printf '%s\n' "$DONE" | sed 's/^/    /'
          say_note "The refusal dialog" "$DONE"
          sleep 2
          screencapture -x /tmp/shots/02-dialog-dismissed.png

          # Straight to the Security section by deep link.
          #
          # Three runs were spent trying to scroll there: the right-hand pane
          # does not take keyboard focus just because the window is frontmost,
          # so Page Down went nowhere, and driving the scroll bar needs a
          # scroll area that this window does not expose. None of that was
          # necessary -- the settings URL takes an anchor, and ?Security lands
          # on the section directly.
          echo "> opening Privacy & Security, straight to Security"
          open "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension?Security" \
            </dev/null >/dev/null 2>&1 &
          sleep 15
          osascript -e 'tell application "System Settings" to activate' >/dev/null 2>&1
          sleep 3
          screencapture -x /tmp/shots/03-security-section.png

          # And now read it, rather than interrogating it.
          #
          # Run 6 asked System Settings for the contents of its own window and
          # got an empty list back -- no error, nothing there. Its interface is
          # SwiftUI in an out-of-process view and it does not hand its contents
          # to an ordinary AppleScript caller. So this reads the picture
          # instead, which works whatever the window is made of.
          echo "> what is actually on that screen:"
          read_screen /tmp/shots/03-security-section.png "The Security section"

          # If the button is there, click it. Finding it is not the same as it
          # working, and the download page should not promise a step that
          # nobody has ever completed.
          echo "> clicking Open Anyway, the way a person would"
          CLICK=$(osascript <<'APPLESCRIPT' 2>&1
          tell application "System Events"
            tell process "System Settings"
              try
                repeat with e in (entire contents of window 1)
                  try
                    if class of e is button then
                      if name of e contains "Open Anyway" then
                        click e
                        return "clicked it"
                      end if
                    end if
                  end try
                end repeat
                return "could not find a button to click (the window does not report its contents)"
              on error errMsg
                return "could not click it: " & errMsg
              end try
            end tell
          end tell
          APPLESCRIPT
          )
          printf '%s\n' "$CLICK" | sed 's/^/    /'
          say_note "Clicking it" "$CLICK"
          sleep 6
          screencapture -x /tmp/shots/04-after-open-anyway.png
          echo "> and the screen afterwards:"
          read_screen /tmp/shots/04-after-open-anyway.png "After the click"

          osascript -e 'tell application "System Settings" to quit' >/dev/null 2>&1


      # The same bundle, fetched the way a one-line installer would fetch it.
      #
      # The quarantine flag is not a property of the file, it is applied by
      # whatever downloaded it. Safari, Chrome, Mail and AirDrop set it; curl,
      # git and wget do not. If that holds, a curl-fetched copy opens with no
      # dialog at all -- no command to paste, nothing to clean up afterwards,
      # and no button offering to move it to the Trash.
      #
      # That would make the Mac instructions one paste instead of three steps,
      # so it is worth proving rather than assuming.
      - name: Run the exact command the download page gives people
        shell: bash
        run: |
          set +e

          # Lifted out of docs/index.html rather than written again here.
          #
          # The previous version of this step used its own curl line, which
          # differed from the published one in three ways: it named the Apple
          # Silicon file directly instead of choosing by processor, it used a
          # tag instead of /releases/latest/, and it unpacked somewhere else.
          # So it tested something nobody is told to run. Reading the page
          # means this can never drift from it again -- change the page and
          # the test changes with it.
          CMD=$(python3 - <<'PY'
          import html, pathlib, re
          page = pathlib.Path("docs/index.html").read_text(encoding="utf-8")
          block = re.search(r"<pre[^>]*><code>(.*?)</code></pre>", page, re.S)
          print(html.unescape(block.group(1)).strip() if block else "")
          PY
          )
          if [ -z "$CMD" ]; then
            echo "could not find the install command on the download page"
            exit 0
          fi
          echo "> the page says to run:"
          echo "    $CMD"
          echo

          # Nothing here pretends to be a browser: no xattr -w anywhere. That
          # is the whole point -- curl does not attach the mark Safari does.
          echo "> running it, exactly as written"
          ( cd "$HOME" && eval "$CMD" ) </dev/null 2>&1 | tail -3 | sed 's/^/    /'

          APP2="$HOME/Desktop/Shortsmith"
          if [ ! -d "$APP2" ]; then
            echo "  the command did not produce $APP2"
            ls -la "$HOME/Desktop" | sed 's/^/    /'
            exit 0
          fi
          echo "  it produced: $APP2"
          echo "  which build did it choose? $(ls "$APP2/runtime/bin/python3" >/dev/null 2>&1 && echo "$(uname -m)")"

          echo "> is anything marked as downloaded?"
          MARKED=$(find "$APP2" -type f -print0 \
                   | xargs -0 xattr -p com.apple.quarantine 2>/dev/null \
                   | wc -l | tr -d ' ')
          echo "  files carrying the mark: $MARKED   (0 means curl set nothing)"

          echo "> double-clicking it, the same way as before"
          open "$APP2/Shortsmith.command" </dev/null >/dev/null 2>&1 &
          sleep 15
          screencapture -x /tmp/shots/05-opened-via-curl.png

          . /tmp/helpers.sh
          say_note "Marked as downloaded" \
            "files carrying the mark after curl: $MARKED (0 means curl set nothing)"
          echo "> and what is on screen after the curl copy was opened:"
          read_screen /tmp/shots/05-opened-via-curl.png "The curl path, on screen"

          echo "> did macOS put a dialog on screen?"
          DIALOG=$(osascript <<'APPLESCRIPT' 2>&1
          tell application "System Events"
            if not (exists process "CoreServicesUIAgent") then
              return "NO DIALOG -- it opened without being blocked"
            end if
            tell process "CoreServicesUIAgent"
              try
                if (count of windows) is 0 then
                  return "NO DIALOG -- it opened without being blocked"
                end if
                set names to {}
                repeat with b in buttons of window 1
                  set end of names to name of b
                end repeat
                return "A DIALOG APPEARED. buttons: " & (names as string)
              on error
                return "NO DIALOG -- it opened without being blocked"
              end try
            end tell
          end tell
          APPLESCRIPT
          )
          printf '%s\n' "$DIALOG" | sed 's/^/    /'
          say_note "Curl path, dialog" "$DIALOG"

          echo "> is Shortsmith actually running?"
          if pgrep -f "shortsmith.app" >/dev/null 2>&1; then
            RUNNING="yes -- the app started"
          else
            RUNNING="no -- it did not start"
          fi
          echo "  $RUNNING"
          say_note "Curl path, did it run" "$RUNNING"

          pkill -f "shortsmith.app" >/dev/null 2>&1
          pkill -f "viacurl" >/dev/null 2>&1
          osascript -e 'tell application "Terminal" to quit' >/dev/null 2>&1
          sleep 2

      - name: What the system log recorded about it
        shell: bash
        run: |
          set +e
          echo "--- Gatekeeper and quarantine entries from the last 5 minutes ---"
          log show --last 5m --style syslog 2>/dev/null \
            | grep -iE "gatekeeper|quarantine|syspolicy|XProtect|assessment" \
            | tail -40
          echo "--- end ---"

      - name: Attach the pictures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: what-a-mac-shows
          path: /tmp/shots
          retention-days: 14
          if-no-files-found: warn

      # Everything below only happens if you asked to drive it yourself.
      - name: Turn on Screen Sharing
        if: ${{ inputs.hold }}
        env:
          VNC_PASSWORD: ${{ secrets.MAC_VNC_PASSWORD }}
        shell: bash
        run: |
          set +e
          if [ -z "$VNC_PASSWORD" ]; then
            echo "No MAC_VNC_PASSWORD secret set, so the desktop stays off."
            echo "You still get a terminal over SSH below."
            exit 0
          fi
          sudo dscl . -passwd /Users/runner "$VNC_PASSWORD" 2>/dev/null
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all -users runner 2>&1 | tail -2
          echo "Screen Sharing is listening locally on port 5900."
          echo "Connect with the port forwarded down your own SSH connection:"
          echo "    ssh -L 5900:localhost:5900 <the ssh line printed below>"
          echo "then point a VNC viewer at localhost:5900, user 'runner'."

      # timeout-minutes is a STEP key, not a tmate input. Under `with:` it
      # would be an input tmate does not have: ignored, and the session would
      # sit open until the job cap.
      - name: Hand over the Mac
        if: ${{ inputs.hold }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113  # v3
        timeout-minutes: ${{ fromJSON(inputs.minutes) }}
        with:
          # Only the account that started the run can connect. This repository
          # is public, so the connection string in the log is readable by
          # anyone -- this is what makes that harmless.
          limit-access-to-actor: true
