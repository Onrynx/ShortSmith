name: Mac desktop

# Answers the one question left about the macOS download: what a person
# actually sees when they double-click Shortsmith for the first time.
#
# GitHub's macOS runners are real Apple Silicon Macs with a real screen. So
# this does the double-click, photographs whatever macOS puts on screen, opens
# System Settings to the place the override would live, and photographs that
# too. The pictures are attached to the run. Nobody has to connect to anything.
#
# spctl already told us Gatekeeper rejects the launcher outright
# (source=no usable signature). What it cannot tell us is whether that refusal
# comes with an "Open Anyway" button or is a dead end, because that is a
# property of the interface. Hence pictures.
#
# If you want to drive the Mac yourself afterwards, set `hold` to true and it
# hands over a session. That part needs the MAC_VNC_PASSWORD secret for the
# desktop; without it you still get a terminal.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test"
        required: false
        default: "v2.3.0"
      hold:
        description: "Also hand me the Mac afterwards (SSH, and desktop if the secret is set)"
        type: boolean
        required: false
        default: false
      minutes:
        description: "If holding, for how long (max 350)"
        required: false
        default: "45"

permissions:
  contents: read

jobs:
  desktop:
    name: What a person sees
    # macOS 26 (Tahoe), the current image and what macos-latest points at.
    # The first run used macos-14 (Sonoma), and Apple changed precisely this
    # behaviour in macOS 15 -- so even a clean answer there would not have been
    # the answer for anybody's actual Mac. macos-14 is also unsupported from
    # 2 November 2026.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Describe the machine
        run: |
          sw_vers
          echo "arch: $(uname -m)"

      # The real download, marked the way a browser marks it. curl does not set
      # the quarantine flag and Safari does, and that flag is the entire reason
      # macOS objects -- without it this would prove nothing.
      - name: Put the real download on the Desktop, marked as downloaded
        id: prep
        shell: bash
        run: |
          set +e
          DESK="$HOME/Desktop"; mkdir -p "$DESK"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ inputs.tag }}/Shortsmith-macOS.zip"
          curl -fL --progress-bar -o "$DESK/Shortsmith-macOS.zip" "$URL" || {
            echo "could not download ${{ inputs.tag }}"; exit 1; }

          STAMP="0081;$(printf '%x' "$(date +%s)");Safari;"
          xattr -w com.apple.quarantine "$STAMP" "$DESK/Shortsmith-macOS.zip"
          ditto -x -k "$DESK/Shortsmith-macOS.zip" "$DESK/unpacked" \
            || unzip -q "$DESK/Shortsmith-macOS.zip" -d "$DESK/unpacked"
          xattr -wr com.apple.quarantine "$STAMP" "$DESK/unpacked" 2>/dev/null

          APP="$DESK/unpacked/Shortsmith"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "ready: $APP"
          xattr -p com.apple.quarantine "$APP/Shortsmith.command" \
            && echo "launcher is marked as downloaded" \
            || echo "WARNING: launcher is NOT marked -- the test would be void"

      - name: Can the screen be photographed at all?
        id: canshoot
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/shots
          screencapture -x /tmp/shots/00-baseline.png 2>/tmp/shots/err.txt
          if [ -s /tmp/shots/00-baseline.png ]; then
            echo "yes: $(du -h /tmp/shots/00-baseline.png | cut -f1)"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "no -- screencapture produced nothing:"
            cat /tmp/shots/err.txt
            echo "(macOS may be refusing screen recording to this process)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # THE TEST. `open` is what Finder uses for a double-click, so this is the
      # same path a person takes.
      #
      # Every stream is sent to /dev/null and nothing is ever waited on. An
      # earlier version piped `open` into sed, so the launched app inherited
      # the step's output pipe and the job hung for 39 minutes -- a step does
      # not end while anything still holds its output.
      - name: Double-click it, and photograph what macOS says
        shell: bash
        run: |
          set +e
          APP="${{ steps.prep.outputs.app }}"

          echo "opening via LaunchServices, exactly as a double-click does"
          open "$APP/Shortsmith.command" </dev/null >/dev/null 2>&1 &
          sleep 12

          screencapture -x /tmp/shots/01-after-double-click.png
          echo "captured the screen after the double-click"

          # Whatever may have started, stop it. Nothing may hold this step open.
          pkill -f "shortsmith.app"   >/dev/null 2>&1
          pkill -f "Shortsmith.command" >/dev/null 2>&1
          osascript -e 'tell application "Terminal" to quit' >/dev/null 2>&1
          sleep 2

      - name: Open Privacy & Security, and photograph that
        shell: bash
        run: |
          set +e

          # The refusal dialog is modal and sits above everything. On the first
          # attempt it stayed on screen, so System Settings opened behind it and
          # the Page Down keystrokes went to the dialog instead of the window.
          # The pictures came back showing the Privacy list with the dialog on
          # top, and the Security section -- the only part that mattered -- was
          # never reached. Dismiss it first.
          killall CoreServicesUIAgent >/dev/null 2>&1
          sleep 2
          screencapture -x /tmp/shots/02-dialog-dismissed.png

          open "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension" \
            </dev/null >/dev/null 2>&1 &
          sleep 12
          osascript -e 'tell application "System Settings" to activate' >/dev/null 2>&1
          sleep 2
          screencapture -x /tmp/shots/03-privacy-and-security.png

          # Security sits at the very bottom of that pane. End, not Page Down,
          # and aimed at the window now that it actually has focus.
          for _ in 1 2 3 4 5 6; do
            osascript -e 'tell application "System Events" to key code 121' >/dev/null 2>&1
            sleep 1
          done
          sleep 2
          screencapture -x /tmp/shots/04-security-section.png

          # A picture needs reading; this does not. Ask the accessibility tree
          # whether a button with that name exists anywhere in the window. It
          # needs permission the runner may not grant, so it is allowed to fail
          # and the screenshots remain the fallback.
          echo "--- looking for an Open Anyway button in the window ---"
          osascript <<'APPLESCRIPT' 2>&1 | sed 's/^/    /'
          tell application "System Events"
            if not (exists process "System Settings") then
              return "System Settings is not running"
            end if
            tell process "System Settings"
              try
                set found to {}
                repeat with b in (every button of entire contents of window 1)
                  set nm to ""
                  try
                    set nm to name of b
                  end try
                  if nm is not "" then set end of found to nm
                end repeat
                return "buttons on screen: " & (found as string)
              on error errMsg
                return "could not read the window: " & errMsg
              end try
            end tell
          end tell
          APPLESCRIPT
          echo "--- end ---"

          osascript -e 'tell application "System Settings" to quit' >/dev/null 2>&1

      - name: What the system log recorded about it
        shell: bash
        run: |
          set +e
          echo "--- Gatekeeper and quarantine entries from the last 5 minutes ---"
          log show --last 5m --style syslog 2>/dev/null \
            | grep -iE "gatekeeper|quarantine|syspolicy|XProtect|assessment" \
            | tail -40
          echo "--- end ---"

      - name: Attach the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: what-a-mac-shows
          path: /tmp/shots
          retention-days: 14
          if-no-files-found: warn

      # Everything below only happens if you asked to drive it yourself.
      - name: Turn on Screen Sharing
        if: ${{ inputs.hold }}
        env:
          VNC_PASSWORD: ${{ secrets.MAC_VNC_PASSWORD }}
        shell: bash
        run: |
          set +e
          if [ -z "$VNC_PASSWORD" ]; then
            echo "No MAC_VNC_PASSWORD secret set, so the desktop stays off."
            echo "You still get a terminal over SSH below."
            exit 0
          fi
          sudo dscl . -passwd /Users/runner "$VNC_PASSWORD" 2>/dev/null
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all -users runner 2>&1 | tail -2
          echo "Screen Sharing is listening locally on port 5900."
          echo "Connect with the port forwarded down your own SSH connection:"
          echo "    ssh -L 5900:localhost:5900 <the ssh line printed below>"
          echo "then point a VNC viewer at localhost:5900, user 'runner'."

      # timeout-minutes is a STEP key, not a tmate input. Under `with:` it
      # would be an input tmate does not have: ignored, and the session would
      # sit open until the job cap.
      - name: Hand over the Mac
        if: ${{ inputs.hold }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: ${{ fromJSON(inputs.minutes) }}
        with:
          # Only the account that started the run can connect. This repository
          # is public, so the connection string in the log is readable by
          # anyone -- this is what makes that harmless.
          limit-access-to-actor: true
