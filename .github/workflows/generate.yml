# Build smoke-test: proves the pipeline still assembles a real vertical .mp4 in
# MOCK mode (no keys, no GPU, no Ollama) on every push. This is just a health
# check — real videos are made locally via the Discord bot, not in CI.
name: build-smoke-test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install minimal deps (mock needs only these)
        run: pip install numpy Pillow PyYAML
      - name: Render a mock Short
        run: python run.py --channel gossip_stories --lane night --mock
      - name: Upload the result
        uses: actions/upload-artifact@v4
        with:
          name: mock-short
          path: |
            output/**/pending/*.mp4
            output/**/pending/*.jpg
          if-no-files-found: error
