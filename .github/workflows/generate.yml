# Scheduled cron for the CLOUD (day) lane's script + metadata.
#
# Heavy render/voice is best done LOCALLY (GPU for Wan2GP, Kokoro weights, etc.).
# In CI we generate the script + metadata and — because GitHub's Ubuntu runners
# have FFmpeg — also assemble a MOCK vertical Short as a downloadable artifact so
# you can eyeball pacing/captions from your phone. Wire real keys via repo
# Secrets (GEMINI_API_KEY, PEXELS_API_KEY, ...) to have it hit the real cloud lane.

name: storyforge-cloud-lane

on:
  schedule:
    - cron: "0 13 * * *"      # 13:00 UTC daily (adjust to your timezone)
  workflow_dispatch:
    inputs:
      channel:
        description: "channel key"
        default: "gaming_lore"
      mock:
        description: "mock mode (no keys)"
        default: "true"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install minimal deps (mock needs only these)
        run: pip install numpy Pillow PyYAML

      - name: Generate the day-lane Short (mock)
        env:
          # Provide these as repo Secrets to run the REAL cloud lane instead:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'gaming_lore' }}"
          python run.py --channel "$CHANNEL" --lane day --mock

      - name: Upload the Short + report
        uses: actions/upload-artifact@v4
        with:
          name: storyforge-day-lane
          path: |
            output/**/pending/*.mp4
            output/**/pending/*.jpg
            output/**/pending/*.report.txt
            output/**/pending/*.json
          if-no-files-found: warn
