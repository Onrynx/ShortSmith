name: Build bundles

# Shortsmith ships a folder containing its own Python and every library, so the
# person installing it needs nothing. Those libraries are compiled, which means
# a bundle can only be assembled ON the system it is for — a Mac bundle needs a
# Mac, a Linux bundle needs Linux.
#
# GitHub has all three. This builds on real hardware for each and attaches the
# results to the release, so no one has to own three computers.

on:
  release:
    types: [published]        # the normal path: publish a release, get bundles
  workflow_dispatch:          # and a manual button, for trying it without a release
    inputs:
      tag:
        description: "Attach to this existing release tag (e.g. v2.3.0). Leave blank to only upload build artifacts."
        required: false
        default: ""

permissions:
  contents: write             # needed to attach files to a release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # A hung step costs real money on the macOS runners, which bill at ten
    # times the Linux rate -- one did, for 39 minutes, before this existed.
    # The whole job normally finishes in under two minutes, so anything past
    # twenty is stuck rather than slow.
    timeout-minutes: 20
    strategy:
      fail-fast: false        # one platform failing must not cancel the others
      matrix:
        include:
          - os: windows-latest
            label: Windows
            asset: Shortsmith-Windows.zip
          # macos-26 (Tahoe), not macos-14. GitHub's macOS 14 image is fully
          # unsupported from 2 November 2026, and macos-latest already points
          # at 26. The runner version barely affects the bundle -- the Python
          # and the wheels are prebuilt and downloaded -- but a retired image
          # stops the build dead.
          - os: macos-26
            label: macOS
            asset: Shortsmith-macOS.zip
          # Intel Macs. A bundle built on Apple Silicon is arm64 only, so one
          # built here is the only thing an Intel Mac can run. macos-13 was
          # retired in December 2025; macos-15-intel replaces it and is
          # supported until autumn 2027.
          - os: macos-15-intel
            label: macOS-Intel
            asset: Shortsmith-macOS-Intel.zip
          - os: ubuntu-latest
            label: Linux
            asset: Shortsmith-Linux.zip

    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # Only used to RUN the build script. The bundle gets its own Python,
      # downloaded by the script, independent of this one.
      - name: Python for the build script
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Refresh the manifest
        shell: bash
        run: |
          python scripts/make_manifest.py
          echo "The manifest must describe the files going into the bundle, or"
          echo "every fresh install re-downloads them on its first update check."

      - name: Build the bundle
        shell: bash
        run: python scripts/build_bundle.py --zip

      - name: Check it is actually runnable
        shell: bash
        run: |
          set -e
          cd build/Shortsmith
          if [ -f runtime/python.exe ]; then
            PY=runtime/python.exe
          else
            PY=runtime/bin/python3
          fi
          "$PY" -c "import shortsmith, shortsmith.webapp, shortsmith.control; print('imports OK, v' + shortsmith.__version__)"
          "$PY" -c "import numpy, PIL, yaml, psutil, onnxruntime, kokoro_onnx, faster_whisper; print('every dependency present')"
          "$PY" -c "
          from shortsmith.hardware import scan
          h = scan()
          print('hardware scan on this runner:', h['os'], h['arch'])
          "

      # The app opens in a real window via pywebview, which needs a different
      # backend on each platform. If that backend is missing, nothing crashes --
      # shortsmith/app.py quietly opens the browser instead -- so a broken
      # bundle looks fine until someone notices they never got a window.
      #
      # This is not hypothetical. The lockfile was once resolved on Windows,
      # which recorded pythonnet with no platform marker and omitted the six
      # pyobjc packages macOS needs. Every Mac download would have been
      # browser-only. Assert the backend instead of trusting the resolver.
      - name: Check the app window can actually open
        shell: bash
        run: |
          set -e
          cd build/Shortsmith
          if [ -f runtime/python.exe ]; then PY=runtime/python.exe; else PY=runtime/bin/python3; fi
          "$PY" -c "
          import webview
          from importlib.metadata import version
          print('pywebview', version('pywebview'))
          "
          case "${{ runner.os }}" in
            Windows)
              "$PY" -c "import clr_loader, pythonnet; print('Windows backend present')" ;;
            macOS)
              "$PY" -c "
          import objc, Cocoa, WebKit, Quartz
          from importlib.metadata import version
          print('macOS backend present (pyobjc', version('pyobjc-core') + ')')
          " ;;
            Linux)
              echo "Linux has no bundled webview backend by choice: GTK/Qt would"
              echo "have to be compiled against this runner's system libraries,"
              echo "which need not exist on the user's machine. Linux opens in"
              echo "the browser, which app.py handles."
              "$PY" -c "
          from shortsmith.app import main
          print('launcher imports; browser fallback is the Linux path')
          " ;;
          esac

      # Everything above inspects files. This runs the thing.
      #
      # A download gets the quarantine mark from the browser, and that mark is
      # the entire reason macOS objects -- so a bundle built here, which has
      # never been downloaded, proves nothing about a first launch. Set the
      # mark by hand, the worst case, then check what a Mac actually does:
      # whether the bundled Python runs while marked, whether the launcher's
      # own clearing line fixes it, and whether a window appears.
      #
      # It cannot double-click in Finder, which macOS treats differently from
      # a terminal, so this does not replace one person trying it once. It does
      # mean a regression in the launcher is caught on the build that causes
      # it rather than by a stranger weeks later.
      #
      # Reports, never blocks: a window server that is unavailable on the
      # runner must not stop a release going out.
      - name: What a Mac does with it
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          # GitHub runs this shell with -e -o pipefail. That is right for a
          # build step and wrong for this one: counting marked files means
          # running xattr -p over every file, and xattr -p exits non-zero for
          # a file that has no such attribute -- which, right after clearing
          # them, is every file. pipefail turns that into a failed pipeline,
          # -e turns the failed assignment into a dead step, and the checks
          # below never run. That is what happened on the first attempt: the
          # step reported nothing and left a red mark on a green build.
          set +e +o pipefail

          APP="$PWD/build/Shortsmith"
          PY="$APP/runtime/bin/python3"
          STAMP="0081;$(printf '%x' "$(date +%s)");Safari;"

          echo "--- marking every file as downloaded (worst case) ---"
          xattr -wr com.apple.quarantine "$STAMP" "$APP"
          MARKED=$(find "$APP" -type f -print0 \
                   | xargs -0 xattr -p com.apple.quarantine 2>/dev/null \
                   | wc -l | tr -d ' ')
          echo "files carrying the mark: $MARKED"

          echo "--- does the bundled Python run while marked? ---"
          if "$PY" -c "print('runs')" 2>/dev/null; then
            echo "RESULT: not blocked while quarantined"
          else
            echo "RESULT: blocked while quarantined -- the launcher's clearing line is load-bearing"
          fi

          echo "--- the launcher's own clearing line ---"
          ( cd "$APP" && xattr -dr com.apple.quarantine . 2>/dev/null || true )
          LEFT=$(find "$APP" -type f -print0 \
                 | xargs -0 xattr -p com.apple.quarantine 2>/dev/null \
                 | wc -l | tr -d ' ')
          echo "files still marked: $LEFT  (want 0)"
          "$PY" -c "print('interpreter runs after clearing')"

          # The question nobody could answer: what does macOS do when the
          # launcher is DOUBLE-CLICKED, rather than run by path from a shell?
          #
          # A double-click goes through LaunchServices, and that is where
          # Gatekeeper engages. `open` uses the same path, and `spctl` is the
          # assessment tool Gatekeeper itself consults. Neither needs a person,
          # so the verdict can be read here instead of guessed at.
          #
          # What matters is WHICH refusal it is. A hard Gatekeeper rejection is
          # the one that needs System Settings and an Open Anyway button. The
          # softer "downloaded from the Internet, are you sure?" prompt has an
          # Open button right on it and needs nothing else. They look similar
          # in a screenshot and are very different to live with.
          echo "--- what Gatekeeper says about a double-click ---"
          ( cd "$APP" && xattr -wr com.apple.quarantine "$STAMP" . )

          echo "> is the launcher quarantined?"
          xattr -p com.apple.quarantine "$APP/Shortsmith.command" \
            && echo "  yes, marked" || echo "  no mark"

          echo "> spctl assessment of the launcher:"
          spctl --assess --type execute -vv "$APP/Shortsmith.command" 2>&1 \
            | sed 's/^/    /'
          echo "  (spctl exit: $?)"

          echo "> spctl assessment of the interpreter:"
          spctl --assess --type execute -vv "$PY" 2>&1 | sed 's/^/    /'

          echo "> is the interpreter signed at all?"
          codesign -dvv "$PY" 2>&1 | head -5 | sed 's/^/    /'

          # Deliberately NOT `open`. An earlier version ran it against the real
          # launcher, which did exactly what it is built to do: started
          # Shortsmith and kept running. A step does not end while anything
          # still holds its output pipe, so the job hung for 39 minutes on a
          # runner billed at ten times the normal rate. The guard meant to stop
          # it captured $! from a pipeline, which is the PID of the last command
          # in it -- sed -- so it killed the wrong process.
          #
          # spctl answers the same question without launching anything, and
          # --type open is the assessment LaunchServices performs when opening
          # a document or script, as opposed to --type execute for a binary.
          echo "> the assessment LaunchServices makes on a double-click:"
          spctl --assess --type open \
                --context context:primary-signature -vv \
                "$APP/Shortsmith.command" </dev/null 2>&1 | sed 's/^/    /'

          echo "> global Gatekeeper state on this machine:"
          spctl --status 2>&1 | sed 's/^/    /'

          ( cd "$APP" && xattr -dr com.apple.quarantine . 2>/dev/null )

          echo "--- does a window open? ---"
          cat > /tmp/window_test.py <<'PYCODE'
          import threading, time, webview

          def close_soon():
              time.sleep(3)
              for w in list(webview.windows):
                  try:
                      w.destroy()
                  except Exception:
                      pass

          webview.create_window("Shortsmith", html="<h1>ok</h1>")
          threading.Thread(target=close_soon, daemon=True).start()
          webview.start()
          print("WINDOW: opened and closed cleanly")
          PYCODE
          cd "$APP"
          "$PY" /tmp/window_test.py & TEST=$!
          ( sleep 90; kill -9 $TEST 2>/dev/null ) & GUARD=$!
          if wait $TEST; then
            echo "RESULT: the window layer works on a real Mac"
          else
            echo "RESULT: the window test did not finish -- may be the runner, may be real"
          fi
          kill $GUARD 2>/dev/null

          # Always succeed. This step reports; the lines above are the output,
          # and a red cross here would only mean "a diagnostic command exited
          # non-zero", which says nothing about the build.
          exit 0

      - name: Keep the build even if nothing is attached
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.asset }}
          path: build/${{ matrix.asset }}
          retention-days: 14

      - name: Attach it to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          gh release upload "$TAG" "build/${{ matrix.asset }}" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Attached ${{ matrix.asset }} to $TAG"
