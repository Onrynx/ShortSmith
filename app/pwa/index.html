<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StoryForge" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
  <title>StoryForge</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">🎬 StoryForge</div>
    <button id="gear" class="icon-btn" title="Settings" aria-label="Settings">⚙️</button>
  </header>

  <main id="view" class="view"><div class="loading">Loading…</div></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="today">🌗<span>Today</span></button>
    <button class="tab" data-tab="review">✅<span>Review</span></button>
    <button class="tab" data-tab="feed">🔔<span>Feed</span></button>
    <button class="tab" data-tab="history">🕓<span>History</span></button>
  </nav>

  <!-- Settings / token modal -->
  <div id="modal" class="modal hidden">
    <div class="sheet">
      <h2>Settings</h2>
      <label>Bearer token (APP_TOKEN)</label>
      <input id="tokenInput" type="password" placeholder="paste your APP_TOKEN" autocomplete="off" />
      <p class="hint">Shown in the terminal when you launch the app. Stored only on this device.</p>
      <button id="saveToken" class="btn primary">Save token</button>
      <button id="enablePush" class="btn">Enable push notifications</button>
      <p class="hint" id="pushHint"></p>
      <p class="hint">iOS: use <b>Share → Add to Home Screen</b> first; push only works from the installed app.</p>
      <button id="closeModal" class="btn ghost">Close</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
